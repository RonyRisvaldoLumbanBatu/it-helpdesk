name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feat/*", "feature/*", "claude/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Cek Kualitas Kode (Cepat)
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json
          coverage: none
          tools: composer:v2

      - name: PHP Syntax Check (Lint)
        run: find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n1 -P 4 php -l

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP-CS-Fixer (Code Style)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

      - name: PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # 2. Unit & Integration Tests
  tests:
    name: 🧪 PHPUnit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

  # 3. Cek Docker Build & Smoke Test (Memastikan aplikasi jalan di container)
  docker-validation:
    name: 🐳 Docker Check
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t it-helpdesk .

      - name: Run Container (Smoke Test)
        run: |
          docker run -d -p 8080:80 --name app-test \
            -e DB_HOST=127.0.0.1 \
            -e DB_NAME=test \
            -e DB_USER=root \
            -e DB_PASS=root \
            it-helpdesk
          sleep 5

      - name: Verify Web Server is Running
        run: |
          curl -I http://localhost:8080 || (docker logs app-test && exit 1)
